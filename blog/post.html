<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ahmed Abdullah">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <title>Blog | Ahmed Abdullah</title>
    <meta name="description" content="An article by Ahmed Abdullah.">
    <meta property="og:type" content="article">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body class="blog-page">
<div class="reading-progress" id="reading-progress"></div>
    <div class="gradient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">
                <span class="logo-bracket">&lt;</span>AA<span class="logo-bracket">/&gt;</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="/#about">About</a></li>
                <li><a href="/#skills">Skills</a></li>
                <li><a href="/#education">Education</a></li>
                <li><a href="/#certificates">Certificates</a></li>
                <li><a href="/blog/" class="active">Blog</a></li>
                <li><a href="/#contact">Contact</a></li>
            </ul>
            <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </nav>
    <div class="mobile-nav-overlay" id="mobile-nav-overlay"></div>

    <main>
        <article class="post" id="post">
            <div class="container post-container">
                <a href="/blog/" class="back-link"><i class="fas fa-arrow-left"></i> All posts</a>
                <div class="post-loading" id="post-loading">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-line"></div>
                    <div class="skeleton skeleton-cover"></div>
                </div>
                <div id="post-root" hidden>
                    <div class="draft-banner" id="draft-banner" hidden><i class="fas fa-eye"></i> Draft preview — only you can see this.</div>
                    <header class="post-header">
                        <div class="post-tags" id="post-tags"></div>
                        <h1 class="post-title" id="post-title"></h1>
                        <p class="post-description" id="post-description"></p>
                        <div class="post-meta" id="post-meta"></div>
                    </header>
                    <figure class="post-cover" id="post-cover" hidden>
                        <img id="post-cover-img" alt="">
                    </figure>
                    <div class="post-layout">
                        <div class="post-body prose" id="post-body"></div>
                        <aside class="post-toc" id="post-toc" hidden>
                            <p class="toc-title">On this page</p>
                            <nav id="toc-links"></nav>
                        </aside>
                    </div>
                    <footer class="post-footer">
                        <div class="share">
                            <span>Share</span>
                            <a id="share-x" target="_blank" rel="noopener" aria-label="Share on X"><i class="fab fa-x-twitter"></i></a>
                            <a id="share-linkedin" target="_blank" rel="noopener" aria-label="Share on LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                            <button type="button" id="share-copy" aria-label="Copy link"><i class="fas fa-link"></i></button>
                        </div>
                        <a href="/blog/" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> More posts</a>
                    </footer>
                </div>
                <div class="post-missing glass-card" id="post-missing" hidden>
                    <h1>Post not found</h1>
                    <p>This post doesn't exist or isn't published yet.</p>
                    <a href="/blog/" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to the blog</a>
                </div>
            </div>
        </article>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <span class="logo-bracket">&lt;</span>AA<span class="logo-bracket">/&gt;</span>
                </div>
                <p>&copy; <span id="year"></span> Ahmed Abdullah. Crafted with <i class="fas fa-heart" style="color: #ef4444;"></i> and precision.</p>
            </div>
        </div>
    </footer>

    <button class="scroll-top" id="scroll-top" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script type="module" src="/src/blog-post.js"></script>
</body>
</html>
